{% extends 'base.html' %}
{% block title %} Team{% endblock %}
{% block content %}
        <section class="d-flex " style="min-height: 90vh;">
            <div class="col-md-6 p-0 position-relative">
                <img src="{{url_for('static',filename='assets/contact-page.jpg')}}" alt="Modern Office" class="img-fluid w-100 h-100 object-fit-cover">
            </div>
            
            <div class="col-md-6 d-flex flex-column justify-content-center px-5 bg-white">
                <h2 class="mb-4 text-dark">Contact Us</h2>
                
                <div class="mb-4">
                    <h6 class="text-muted mb-3">TOURIST VISITS</h6>
                    <p class="mb-1"><strong>Tuesday – Saturday</strong></p>
                    <p class="mb-1">9:00 am – 5:00 pm PST</p>
                    <p class="mb-1"><a href="mailto:info@example.com" class="text-decoration-none text-muted">info@example.com</a></p>
                    <p class="mb-0"><a href="tel:+1234567890" class="text-decoration-none text-muted">(123) 456-7890</a></p>
                </div>
                
                <form>
                    <h6 class="mt-4 mb-3 text-muted">COMMERCIAL REQUESTS</h6>
                    
                    <div class="mb-3">
                        <input type="text" class="form-control form-control-lg border-0 border-bottom border-2 rounded-0 px-0" placeholder="Full Name" style="border-color: #e9ecef !important;">
                    </div>
                    
                    <div class="mb-3">
                        <input type="email" class="form-control form-control-lg border-0 border-bottom border-2 rounded-0 px-0" placeholder="Email" style="border-color: #e9ecef !important;">
                    </div>
                    
                    <div class="mb-4">
                        <textarea class="form-control form-control-lg border-0 border-bottom border-2 rounded-0 px-0" placeholder="Message" rows="3" style="border-color: #e9ecef !important; resize: none;"></textarea>
                    </div>
                    
                    <button class="btn btn-outline-dark btn-lg px-4 py-2" type="submit">Submit Request</button>
                </form>
            </div>
        </section>
{% endblock %}
