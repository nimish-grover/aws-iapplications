<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Management Pie Chart</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <style>
        .chart-container {
            width: 100%;
            height: 600px;
            margin: 20px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        @media (max-width: 768px) {
            .chart-container {
                height: 450px;
            }
        }

        .legend-container {
            margin-top: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 15px;
            padding: 5px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .legend-item:hover {
            background-color: #f8f9fa;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            margin-right: 10px;
            border-radius: 3px;
            border: 1px solid rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <h2 class="title">Water Management Framework</h2>
                <div class="chart-container" id="pieChart"></div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <div class="d-flex flex-wrap justify-content-center legend-container">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #FF6B6B;"></div>
                        <small>Integrated Water Management</small>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #4ECDC4;"></div>
                        <small>Water Governance</small>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #45B7D1;"></div>
                        <small>Water Conservation Infrastructure</small>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #96CEB4;"></div>
                        <small>Drinking Water for All</small>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #FFEAA7;"></div>
                        <small>Irrigation Efficiency</small>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #DDA0DD;"></div>
                        <small>Smart Water</small>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #FFB347;"></div>
                        <small>Digital Water Management</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Initialize the echarts instance
        const chartDom = document.getElementById('pieChart');
        const myChart = echarts.init(chartDom);

        // Water management data - all with equal values for equal sections
        const data = [
            {
                value: 1,
                name: 'Integrated Water Management',
                itemStyle: { color: '#FF6B6B' }
            },
            {
                value: 1,
                name: 'Water Governance',
                itemStyle: { color: '#4ECDC4' }
            },
            {
                value: 1,
                name: 'Water Conservation Infrastructure',
                itemStyle: { color: '#45B7D1' }
            },
            {
                value: 1,
                name: 'Drinking Water for All',
                itemStyle: { color: '#96CEB4' }
            },
            {
                value: 1,
                name: 'Irrigation Efficiency',
                itemStyle: { color: '#FFEAA7' }
            },
            {
                value: 1,
                name: 'Smart Water',
                itemStyle: { color: '#DDA0DD' }
            },
            {
                value: 1,
                name: 'Digital Water Management',
                itemStyle: { color: '#FFB347' }
            }
        ];

        // Chart configuration
        const option = {
            tooltip: {
                trigger: 'item',
                formatter: '{b}<br/>Water Management Component',
                backgroundColor: 'rgba(0,0,0,0.8)',
                borderColor: 'transparent',
                textStyle: {
                    color: '#fff',
                    fontSize: 12
                }
            },
            series: [
                {
                    name: 'Water Management',
                    type: 'pie',
                    radius: ['30%', '70%'],
                    center: ['50%', '50%'],
                    avoidLabelOverlap: true,
                    emphasis: {
                        scale: true,
                        scaleSize: 10,
                        itemStyle: {
                            shadowBlur: 20,
                            shadowColor: 'rgba(0, 0, 0, 0.3)'
                        }
                    },
                    label: {
                        show: true,
                        position: 'inside',
                        fontSize: 11,
                        fontWeight: 'bold',
                        color: '#fff',
                        textShadowColor: 'rgba(0, 0, 0, 0.8)',
                        textShadowBlur: 3,
                        formatter: function(params) {
                            // Split long text into multiple lines
                            const name = params.name;
                            if (name.length > 15) {
                                const words = name.split(' ');
                                const lines = [];
                                let currentLine = '';
                                
                                words.forEach(word => {
                                    if ((currentLine + word).length > 15) {
                                        if (currentLine) lines.push(currentLine.trim());
                                        currentLine = word + ' ';
                                    } else {
                                        currentLine += word + ' ';
                                    }
                                });
                                if (currentLine) lines.push(currentLine.trim());
                                
                                return lines.join('\n');
                            }
                            return name;
                        }
                    },
                    labelLine: {
                        show: false
                    },
                    data: data
                }
            ],
            graphic: {
                type: 'text',
                left: 'center',
                top: 'center',
                style: {
                    text: 'Vision 2047',
                    textAlign: 'center',
                    fill: '#333',
                    fontSize: 16,
                    fontWeight: 'bold',
                    lineHeight: 20
                }
            }
        };

        // Set the configuration
        myChart.setOption(option);

        // Handle window resize
        window.addEventListener('resize', function() {
            myChart.resize();
        });

        // Add hover effects for legend items
        const legendItems = document.querySelectorAll('.legend-item');
        legendItems.forEach((item, index) => {
            item.addEventListener('mouseenter', function() {
                myChart.dispatchAction({
                    type: 'highlight',
                    seriesIndex: 0,
                    dataIndex: index
                });
            });
            
            item.addEventListener('mouseleave', function() {
                myChart.dispatchAction({
                    type: 'downplay',
                    seriesIndex: 0,
                    dataIndex: index
                });
            });
        });

        // Handle mobile responsiveness
        function updateChartForMobile() {
            const isMobile = window.innerWidth <= 768;
            const newOption = {
                series: [{
                    radius: isMobile ? ['25%', '65%'] : ['30%', '70%'],
                    label: {
                        fontSize: isMobile ? 9 : 11
                    }
                }],
                graphic: {
                    style: {
                        fontSize: isMobile ? 14 : 16
                    }
                }
            };
            myChart.setOption(newOption);
        }

        // Initial mobile check
        updateChartForMobile();

        // Update on resize
        window.addEventListener('resize', function() {
            updateChartForMobile();
        });
    </script>
</body>
</html>
